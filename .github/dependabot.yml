# Weekly dependency updates, with minor and patch bumps grouped into one pull
# request per ecosystem so they are cheap to review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /http/realm-ui
    schedule:
      interval: weekly
    groups:
      ui:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    groups:
      sdk:
        update-types: [minor, patch]
