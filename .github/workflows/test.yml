name: pull-request

on:
  pull_request:

jobs:
  test-unix:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu
          - macOS
          - windows
        go:
          - 1.26.x
          - 1.27.x
    name: "${{ matrix.platform }} | ${{ matrix.go }}"
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      - name: Test
        run: |
          go test ./...
          go test -race ./...

  test-postgres:
    name: "postgres"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: realm
          POSTGRES_PASSWORD: realm
          POSTGRES_DB: realm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REALM_POSTGRES_TEST_URL: postgres://realm:realm@localhost:5432/realm_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.27.x

      - name: Test
        run: go test -race ./pkg/storage/... ./http/...

  test-typescript-sdk:
    name: "typescript sdk"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
