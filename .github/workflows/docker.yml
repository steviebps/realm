name: docker

# Builds the realm image for linux/amd64 and linux/arm64. Pushes to master
# publish it to GitHub Container Registry as ghcr.io/<owner>/realm:edge; pull
# requests build it without publishing. Release images (1.2.3, 1.2, latest)
# are published by release.yml.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - go.mod
      - go.sum
      - http/realm-ui/package-lock.json

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/realm
          tags: |
            type=edge,branch=master

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          # Only master writes the shared cache, so PRs do not evict it.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
