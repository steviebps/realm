name: ci

# Every check a change must pass. Pull requests and master run it directly;
# release.yml runs it again (workflow_call) before publishing anything. Mark
# the "ci-ok" job as the one required status check in branch protection: it
# fails whenever any other job fails or is cancelled.

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test (race)
        run: go test -race -count=1 ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: realm
          POSTGRES_PASSWORD: realm
          POSTGRES_DB: realm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REALM_POSTGRES_TEST_URL: postgres://realm:realm@localhost:5432/realm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test against Postgres (race)
        run: go test -race -count=1 ./pkg/storage/... ./http/...

  etcd:
    runs-on: ubuntu-latest
    services:
      etcd:
        image: gcr.io/etcd-development/etcd:v3.7.3
        # etcd reads every flag from an ETCD_* variable; the image has no
        # shell for a health command, so a step waits for it instead
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
        ports:
          - 2379:2379
    env:
      REALM_ETCD_TEST_ENDPOINTS: http://127.0.0.1:2379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Wait for etcd
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2379/health && exit 0
            sleep 1
          done
          exit 1
      - name: Test against etcd (race)
        run: go test -race -count=1 ./pkg/storage/... ./http/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Fetch modules up front (with retries) so a transient proxy error
      # doesn't surface as a misleading typecheck failure inside the linter.
      - name: Download modules
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  typescript-sdk:
    name: typescript sdk (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # the oldest Node the test tooling runs on, and the current LTS
        node: [22, 24]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        if: matrix.node == 24
        run: npm pack --dry-run

  # The package supports Node 18 (engines), which the test tooling no longer
  # runs on: build on a current Node, then smoke-test the build on Node 18.
  typescript-sdk-node18:
    name: typescript sdk (node 18 runtime)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node test/smoke-node18.mjs

  ui:
    name: ui (and embedded build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: http/realm-ui/package-lock.json
      - name: Lint, test, typecheck, and build the UI
        working-directory: http/realm-ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The release binaries and the image embed the UI (-tags=ui), which
      # the other jobs never compile.
      - name: Vet and build with the UI embedded
        run: |
          go vet -tags=ui ./...
          go build -tags=ui -o /dev/null .

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install the TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci
      - name: Build realm
        run: go build -o realm .
      - name: Run against a real server
        run: ./scripts/e2e.sh ./realm
      - name: Server log
        if: failure()
        run: cat e2e-server.log || true

  ci-ok:
    name: ci-ok
    if: always()
    needs: [go, postgres, etcd, lint, typescript-sdk, typescript-sdk-node18, ui, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "a required job did not pass: ${{ toJSON(needs.*.result) }}"
          exit 1
      - run: echo "all checks passed"
