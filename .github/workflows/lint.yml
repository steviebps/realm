name: lint

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      # Fetch modules up front (with retries) so a transient proxy error
      # doesn't surface as a misleading typecheck failure inside the linter.
      - name: Download modules
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          exit 1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
