# Make sure to check the documentation at http://goreleaser.com
version: 2
before:
  hooks:
    - go mod download
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w -X github.com/steviebps/realm/cmd.Version={{ .Version }}
    tags:
      - ui
# Sign the macOS binaries with a Developer ID certificate and notarize them,
# so Gatekeeper runs them without a trip to System Settings. On when the
# repository variable MACOS_NOTARIZE is "true"; the release then fails rather
# than ship unsigned if a secret is missing. See docs/RELEASING.md.
notarize:
  macos:
    - enabled: '{{ eq (envOrDefault "MACOS_NOTARIZE" "") "true" }}'
      sign:
        # base64 of the Developer ID Application .p12
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        # an App Store Connect API key: base64 of the .p8, its key ID, and
        # the issuer ID
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # fail the release if Apple rejects the binaries
        wait: true
        timeout: 20m
archives:
  - 
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: zip
    files:
      - configs/*
checksum:
  name_template: 'checksums.txt'
release:
  # v1.2.3-rc.1 and the like are marked as prereleases
  prerelease: auto
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
homebrew_casks:
  - name: realm
    description: "Feature flags and configuration with targeting, progressive rollout, and real-time sync"
    # prereleases do not update the cask
    skip_upload: auto
    repository:
      owner: steviebps
      name: homebrew-realm
      branch: main
      # a fine-grained token with contents:write on this repository only
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    url: 
      template: https://github.com/steviebps/realm/releases/download/{{ .Tag }}/{{ .ArtifactName }}
      using: ":homebrew_curl"
    homepage: "https://github.com/steviebps/realm"
    license: "Apache 2.0"
